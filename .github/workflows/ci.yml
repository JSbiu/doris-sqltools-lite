name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - if: runner.os == 'Linux'
        run: pnpm run package
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: doris-sqltools-lite-*.vsix
          if-no-files-found: error

  vscode-1-90:
    name: VS Code 1.90 integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-1.90.0-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: xvfb-run -a pnpm run test:vscode
        env:
          VSCODE_TEST_VERSION: 1.90.0
